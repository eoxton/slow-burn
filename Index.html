<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slow Burn</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,serif;background:radial-gradient(circle at top,#3a0f1f,#120408 70%);color:#f6e7ea;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:420px}
  h1{text-align:center;font-size:2.2rem;letter-spacing:2px;color:#ff8fa3;margin-bottom:4px}
  .sub{text-align:center;opacity:.7;font-style:italic;margin-bottom:24px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,143,163,.3);border-radius:18px;padding:22px;margin-bottom:16px}
  input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #6b2a3a;background:#1d0910;color:#f6e7ea;font-family:inherit;font-size:1rem;margin-bottom:12px}
  textarea{min-height:120px;font-size:.9rem}
  button{width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:1.05rem;cursor:pointer;margin-top:8px}
  .primary{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff}
  .ghost{background:transparent;border:1px solid #ff8fa3;color:#ff8fa3}
  .row{display:flex;gap:10px}
  .row button{flex:1}
  .level{text-align:center;text-transform:uppercase;letter-spacing:3px;font-size:.85rem;color:#ffb3c1}
  .levelname{text-align:center;font-size:1.8rem;margin:6px 0 4px}
  .turn{text-align:center;font-size:1.15rem;margin:10px 0}
  .task{text-align:center;font-size:1.35rem;line-height:1.5;min-height:90px;display:flex;align-items:center;justify-content:center;padding:10px}
  .stats{display:flex;justify-content:space-between;font-size:.85rem;opacity:.8}
  .dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4a1a26;margin-left:4px}
  .dots span.on{background:#ff4d6d}
  label{display:block;margin:10px 0 6px;color:#ffb3c1}
  .hidden{display:none}
  .small{font-size:.85rem;opacity:.7;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Slow Burn</h1>
  <p class="sub">a game of patience and pleasure</p>

  <!-- Setup -->
  <div id="setup" class="card">
    <label>Player one</label>
    <input id="p1" placeholder="Name">
    <label>Player two</label>
    <input id="p2" placeholder="Name">
    <p class="small">Each of you gets 2 passes. Earn 3 rewards each to unlock the next level.</p>
    <button class="primary" onclick="startGame()">Begin</button>
    <button class="ghost" onclick="openEditor()">Customize tasks</button>
  </div>

  <!-- Game -->
  <div id="game" class="hidden">
    <div class="card">
      <div class="level" id="levelNum"></div>
      <div class="levelname" id="levelName"></div>
      <div class="turn" id="turn"></div>
      <div class="task" id="task">Tap Draw to reveal your reward</div>
      <div class="row">
        <button class="ghost" id="passBtn" onclick="pass()">Pass</button>
        <button class="primary" id="mainBtn" onclick="draw()">Draw</button>
      </div>
    </div>
    <div class="card stats">
      <div id="s0"></div>
      <div id="s1"></div>
    </div>
    <button class="ghost" onclick="resetGame()">Start over</button>
  </div>

  <!-- Editor -->
  <div id="editor" class="hidden">
    <div class="card">
      <p class="small">One task per line. Empty levels are skipped. Saved privately on this device.</p>
      <div id="fields"></div>
      <button class="primary" onclick="saveEditor()">Save</button>
      <button class="ghost" onclick="restoreDefaults()">Restore defaults</button>
      <button class="ghost" onclick="show('setup')">Back</button>
    </div>
  </div>
</div>

<script>
const DEFAULT = [
  {name:"Spark", tasks:[
    "A slow 10-second kiss, lips only",
    "Kiss the back of your partner's neck",
    "Whisper one thing you find irresistible about them",
    "Give a 1-minute shoulder rub",
    "Trace a word on their back â they guess it",
    "Hold eye contact for 30 seconds without laughing"]},
  {name:"Warm", tasks:[
    "Remove one piece of your partner's clothing",
    "2-minute oil massage, anywhere they choose",
    "Blindfold them and kiss three places they must guess",
    "Kiss along their jawline and collarbone",
    "They tell you exactly where to kiss them",
    "Slow dance, as close as possible"]},
  {name:"Heat", tasks:[
    "Remove two pieces of clothing â theirs or yours",
    "Run an ice cube or feather slowly wherever you like",
    "Blindfolded partner receives 2 minutes of your touch",
    "Guide their hands where you want them for 1 minute",
    "Trail kisses from their neck down as far as they allow",
    "Describe out loud what you want to do next"]},
  {name:"Fire", tasks:[
    "Winner's choice for 5 minutes",
    "Share a fantasy you've never told them",
    "Blindfolded partner can't touch â only receive",
    "Undress each other completely, slowly",
    "Take turns giving one instruction each",
    "Game over â you both win"]},
  {name:"After Dark", tasks:[]}
];

let levels = JSON.parse(localStorage.getItem('sb_levels') || 'null') || JSON.parse(JSON.stringify(DEFAULT));
let S = {};

function show(id){
  ['setup','game','editor'].forEach(x=>document.getElementById(x).classList.toggle('hidden', x!==id));
}

function active(){ return levels.filter(l=>l.tasks.length); }

function startGame(){
  const n1 = document.getElementById('p1').value.trim() || 'Player 1';
  const n2 = document.getElementById('p2').value.trim() || 'Player 2';
  if(!active().length){ alert('Add some tasks first.'); return; }
  S = {names:[n1,n2], turn:0, lvl:0, done:[0,0], passes:[2,2], drawn:false, last:null};
  show('game'); render();
}

function render(){
  const L = active(), lv = L[S.lvl];
  document.getElementById('levelNum').textContent = `Level ${S.lvl+1} of ${L.length}`;
  document.getElementById('levelName').textContent = lv.name;
  document.getElementById('turn').textContent = `${S.names[S.turn]}'s turn`;
  document.getElementById('mainBtn').textContent = S.drawn ? 'Done â' : 'Draw';
  const pb = document.getElementById('passBtn');
  pb.textContent = `Pass (${S.passes[S.turn]})`;
  pb.disabled = !S.drawn || S.passes[S.turn] === 0;
  pb.style.opacity = pb.disabled ? .4 : 1;
  for(let i=0;i<2;i++){
    let dots = '';
    for(let d=0; d<3; d++) dots += `<span class="${d<S.done[i]?'on':''}"></span>`;
    document.getElementById('s'+i).innerHTML = `${S.names[i]} <span class="dots">${dots}</span>`;
  }
}

function draw(){
  if(S.drawn){ complete(); return; }
  const tasks = active()[S.lvl].tasks;
  let t;
  do { t = tasks[Math.floor(Math.random()*tasks.length)]; }
  while(tasks.length > 1 && t === S.last);
  S.last = t; S.drawn = true;
  document.getElementById('task').textContent = t;
  render();
}

function complete(){
  S.done[S.turn] = Math.min(3, S.done[S.turn]+1);
  nextTurn();
}

function pass(){
  if(!S.drawn || S.passes[S.turn]===0) return;
  S.passes[S.turn]--;
  nextTurn();
}

function nextTurn(){
  S.drawn = false;
  const L = active();
  if(S.done[0]>=3 && S.done[1]>=3){
    if(S.lvl < L.length-1){
      S.lvl++; S.done=[0,0];
      document.getElementById('task').textContent = `Level up â welcome to ${L[S.lvl].name} ð¥`;
    } else {
      document.getElementById('task').textContent = 'You made it to the end. Enjoy each other â¤ï¸';
    }
  } else {
    document.getElementById('task').textContent = 'Tap Draw to reveal your reward';
  }
  S.turn = 1 - S.turn;
  render();
}

function resetGame(){ if(confirm('Start over?')) show('setup'); }

function openEditor(){
  document.getElementById('fields').innerHTML = levels.map((l,i)=>
    `<label>Level ${i+1}: ${l.name}</label><textarea id="ta${i}">${l.tasks.join('\n')}</textarea>`
  ).join('');
  show('editor');
}

function saveEditor(){
  levels.forEach((l,i)=>{
    l.tasks = document.getElementById('ta'+i).value.split('\n').map(s=>s.trim()).filter(Boolean);
  });
  localStorage.setItem('sb_levels', JSON.stringify(levels));
  show('setup');
}

function restoreDefaults(){
  if(!confirm('Replace all tasks with the defaults?')) return;
  levels = JSON.parse(JSON.stringify(DEFAULT));
  localStorage.removeItem('sb_levels');
  openEditor();
}
</script>
</body>
</html>
